<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Angkor&family=Asimovian&family=Bitcount+Grid+Double:wght@100..900&family=Bungee+Tint&family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Chango&family=Silkscreen:wght@400;700&family=Tektur:wght@400..900&display=swap" rel="stylesheet">
 
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
 
        :root {
            --bg: #0b0c10;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.09);
            --text-primary: #f0f0f0;
            --text-secondary: #777;
            --accent: #8f6dff;
            --radius: 6px;
            --font: 'Chakra Petch', sans-serif;
        }
 
        html, body {
            
            position: relative;
            min-height: 100%;
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 14px;
            line-height: 1.6;
            
            overflow-x: visible; 
            overflow-y: auto;
        }

        #neural-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
 
        nav.top-nav {
            position:relative; z-index:10;
            width:100%;
            display:flex; justify-content:space-between; align-items:center;
            padding:1.4rem 5%;
            flex-shrink:0;
            border-bottom:1px solid var(--border);
            backdrop-filter:blur(8px);
        }
        .logo {
            font-family: "Asimovian", sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #fff;
            text-transform: uppercase;
            text-decoration: none;
        }
        .logo span { color: var(--accent); }
 
        
        main.shell {
            position: relative;
            z-index: 10;
            max-width: 860px;
            margin: 52px auto;
            padding: 0 24px;
        }
 
        
        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
        }
 
        .eyebrow {
            display: block;
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
 
        .page-header h1 {
            font-family: var(--font);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--text-primary);
        }
 
        
        .primary-btn,
        .secondary-btn,
        .danger-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: var(--radius);
            cursor: pointer;
            white-space: nowrap;
 
            
            transition: none !important;
            transform: none !important;
            animation: none !important;
            box-shadow: none !important;
        }
 
        .primary-btn {
            background: var(--text-primary);
            color: #0b0c10;
            border: 1px solid var(--text-primary);
        }
        .primary-btn:hover { background: #d4d4d4; border-color: #d4d4d4; }
        .primary-btn:active { background: #b8b8b8; border-color: #b8b8b8; }
 
        .secondary-btn {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .secondary-btn:hover { background: var(--surface-hover); }
        .secondary-btn:active { background: rgba(255,255,255,0.12); }
 
        .danger-btn {
            background: transparent;
            color: #ff5555;
            border: 1px solid rgba(255, 85, 85, 0.28);
        }
        .danger-btn:hover { background: rgba(255, 85, 85, 0.1); }
        .danger-btn:active { background: rgba(255, 85, 85, 0.18); }
 
        
        .glass-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }
 
        
        .table-wrap { width: 100%; overflow-x: auto; }
 
        .admin-table {
            width: 100%;
            border-collapse: collapse;
        }
 
        .admin-table thead tr {
            border-bottom: 1px solid var(--border);
        }
 
        .admin-table th {
            padding: 13px 20px;
            text-align: left;
            font-family: var(--font);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
 
        .admin-table tbody tr {
            border-bottom: 1px solid var(--border);
        }
        .admin-table tbody tr:last-child { border-bottom: none; }
        .admin-table tbody tr:hover { background: var(--surface-hover); }
 
        .admin-table td {
            padding: 13px 20px;
            font-family: var(--font);
            font-size: 13px;
            color: var(--text-primary);
            vertical-align: middle;
        }
 
        .admin-table td:nth-child(2) { color: var(--text-secondary); }
 
        
        .action-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
 
        
        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 52px 20px !important;
            font-size: 13px;
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body class="admin-page">
    <canvas id="neural-canvas"></canvas>
    <div class="scroll-progress"></div>

    <nav class="top-nav">
        <div class="logo">INNER<span>TURE</span></div>
    </nav>
 
    <main class="shell">
        <div class="work-tablet admin-shell">
            <header class="page-header">
                <div>
                    <span class="eyebrow">Admin Dashboard</span>
                    <h1>Manage Users</h1>
                </div>
                <a class="primary-btn" href="add-user.html">+ Add New User</a>
            </header>
 
            <section class="admin-card glass-card">
                <div class="table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
 
    <script src="script.js"></script>
</body>
</html>
