<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Innerture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asimovian&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b0c10;
            --surface: rgba(255,255,255,0.04);
            --surface-hover: rgba(255,255,255,0.07);
            --border: rgba(255,255,255,0.09);
            --border-focus: rgba(143,109,255,0.6);
            --text-primary: #f0f0f0;
            --text-secondary: #666;
            --accent: #8f6dff;
            --accent-glow: rgba(143,109,255,0.35);
            --radius: 8px;
            --font: 'Chakra Petch', sans-serif;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 14px;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ── Starfield canvas ── */
        #neural-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Nav ── */
        nav.top-nav {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.4rem 5%;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(8px);
        }

        .logo {
            font-family: "Asimovian", sans-serif;
            font-size: 1.3rem;
            letter-spacing: 4px;
            color: #fff;
            text-transform: uppercase;
            text-decoration: none;
        }
        .logo span { color: var(--accent); }

        .nav-label {
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        /* ── Center layout ── */
        .page-center {
            position: relative;
            z-index: 10;
            min-height: calc(100vh - 65px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        /* ── Card ── */
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: rgba(255,255,255,0.035);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 40px 36px 32px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset,
                        0 40px 80px rgba(0,0,0,0.5);
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Eyebrow ── */
        .eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 14px;
        }
        .eyebrow::before {
            content: '';
            display: block;
            width: 28px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
        }

        .auth-card h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .auth-card .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        /* ── Fields ── */
        .field-group {
            margin-bottom: 16px;
        }

        .field-label {
            display: block;
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 7px;
        }

        .field-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-icon {
            position: absolute;
            left: 14px;
            width: 15px;
            height: 15px;
            opacity: 0.4;
            pointer-events: none;
            flex-shrink: 0;
        }

        .field-wrap input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 13px;
            padding: 12px 14px 12px 40px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .field-wrap input::placeholder {
            color: #3a3a50;
        }

        .field-wrap input:focus {
            border-color: var(--border-focus);
            background: rgba(143,109,255,0.06);
            box-shadow: 0 0 0 3px rgba(143,109,255,0.12);
        }

        /* ── Error ── */
        .error-msg {
            font-size: 11px;
            color: #ff4d4d;
            margin-bottom: 14px;
            display: none;
            letter-spacing: 0.02em;
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── Buttons ── */
        .btn-primary {
            display: block;
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: #fff;
            font-family: var(--font);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: opacity 0.2s, box-shadow 0.2s, transform 0.15s;
            margin-top: 8px;
        }
        .btn-primary:hover {
            opacity: 0.9;
            box-shadow: 0 0 28px var(--accent-glow);
            transform: translateY(-1px);
        }
        .btn-primary:active { transform: translateY(0); }

        .btn-secondary {
            display: block;
            width: 100%;
            padding: 13px;
            background: transparent;
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s;
        }
        .btn-secondary:hover {
            background: var(--surface-hover);
            border-color: rgba(255,255,255,0.18);
        }

        /* ── Footer note ── */
        .card-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 10px;
            letter-spacing: 0.04em;
            color: #333345;
        }
    </style>
</head>
<body>
    <canvas id="neural-canvas"></canvas>

    <nav class="top-nav">
        <a href="/" class="logo">INNER<span>TURE</span></a>
        <span class="nav-label">Secure Portal</span>
    </nav>

    <div class="page-center">
        <div class="auth-card">
            <p class="eyebrow">Registration</p>
            <h1>Create account</h1>
            <p class="subtitle">Join Innerture to get started</p>

            <div id="register-error" class="error-msg"></div>

            <div class="field-group">
                <label class="field-label" for="name">Full Name</label>
                <div class="field-wrap">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="name" placeholder="Jane Smith" required>
                </div>
            </div>

            <div class="field-group">
                <label class="field-label" for="email">Email Address</label>
                <div class="field-wrap">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                    </svg>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
            </div>

            <div class="field-group">
                <label class="field-label" for="password">Password</label>
                <div class="field-wrap">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button class="btn-primary" id="registerBtn">Create Account</button>

            <div class="divider">or</div>

            <a href="/login" class="btn-secondary">Sign In Instead</a>

            <p class="card-footer">Protected by end-to-end encryption</p>
        </div>
    </div>

    <script>
        /* ── Starfield ── */
        (function () {
            const canvas = document.getElementById('neural-canvas');
            const ctx = canvas.getContext('2d');
            let W, H, stars = [];

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            function makeStars(n) {
                stars = [];
                for (let i = 0; i < n; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 1.2 + 0.3,
                        o: Math.random() * 0.5 + 0.1,
                        speed: Math.random() * 0.15 + 0.05
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                stars.forEach(s => {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${s.o})`;
                    ctx.fill();
                    s.y -= s.speed;
                    if (s.y < 0) { s.y = H; s.x = Math.random() * W; }
                });
                requestAnimationFrame(draw);
            }

            window.addEventListener('resize', () => { resize(); makeStars(160); });
            resize(); makeStars(160); draw();
        })();

        /* ── Form ── */
        document.getElementById('registerBtn').addEventListener('click', async function () {
            const name  = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const pass  = document.getElementById('password').value;
            const errEl = document.getElementById('register-error');
            const btn   = this;

            errEl.style.display = 'none';

            if (!name || !email || !pass) {
                errEl.textContent = 'Please fill in all fields.';
                errEl.style.display = 'block';
                return;
            }

            if (pass.length < 6) {
                errEl.textContent = 'Password must be at least 6 characters.';
                errEl.style.display = 'block';
                return;
            }

            const origText = btn.textContent;
            btn.textContent = 'Creating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password: pass })
                });

                const data = await res.json();

                if (!res.ok) {
                    errEl.textContent = data.error || 'Failed to register';
                    errEl.style.display = 'block';
                    return;
                }

                localStorage.setItem('loggedInUser', JSON.stringify(data.user));
                window.location.href = '/'; 
            } catch (err) {
                errEl.textContent = 'Could not connect. ' + err.message;
                errEl.style.display = 'block';
            } finally {
                btn.textContent = origText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
