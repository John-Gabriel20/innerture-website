<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Innerture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asimovian&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b0c10;
            --surface: rgba(255,255,255,0.04);
            --surface-hover: rgba(255,255,255,0.07);
            --border: rgba(255,255,255,0.09);
            --border-focus: rgba(143,109,255,0.6);
            --text-primary: #f0f0f0;
            --text-secondary: #666;
            --accent: #8f6dff;
            --accent-glow: rgba(143,109,255,0.35);
            --radius: 8px;
            --font: 'Chakra Petch', sans-serif;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 14px;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ── Canvas background ── */
        #neural-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, rgba(143,109,255,0.08) 0%, transparent 70%);
        }

        /* ── Nav ── */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.4rem 5%;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(8px);
            background: rgba(11,12,16,0.8);
        }

        .logo {
            font-family: 'Asimovian', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #fff;
            text-transform: uppercase;
            text-decoration: none;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-tag {
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        /* ── Page container ── */
        .page {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 24px 40px;
        }

        /* ── Card ── */
        .card {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.035);
            border: 1px solid var(--border);
            border-radius: 14px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset,
                        0 40px 80px rgba(0,0,0,0.5);
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-accent {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--accent), transparent);
        }

        .card-body {
            padding: 40px 36px 32px;
        }

        .card-header {
            margin-bottom: 24px;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 14px;
        }

        .eyebrow::before {
            content: '';
            display: block;
            width: 28px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
        }

        .card-header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .card-header p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* ── Form ── */
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #login-error {
            font-size: 12px;
            color: #ff4d4d;
            margin-bottom: 12px;
            display: none;
            letter-spacing: 0.02em;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label {
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 13px;
            padding: 12px 14px 12px 40px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        input::placeholder {
            color: #3a3a50;
        }

        input:focus {
            border-color: var(--border-focus);
            background: rgba(143,109,255,0.06);
            box-shadow: 0 0 0 3px rgba(143,109,255,0.12);
        }

        .input-icon {
            position: absolute;
            left: 12px;
            width: 16px;
            height: 16px;
            opacity: 0.4;
            flex-shrink: 0;
        }

        /* ── Forgot password ── */
        .forgot {
            font-size: 11px;
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .forgot:hover {
            opacity: 0.8;
        }

        /* ── Buttons ── */
        .btn-primary {
            padding: 13px;
            background: var(--accent);
            color: #fff;
            font-family: var(--font);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: opacity 0.2s, box-shadow 0.2s, transform 0.15s;
            margin-top: 8px;
        }

        .btn-primary:hover {
            opacity: 0.9;
            box-shadow: 0 0 28px var(--accent-glow);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-ghost {
            display: block;
            width: 100%;
            padding: 13px;
            background: transparent;
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-ghost:hover {
            background: var(--surface-hover);
            border-color: rgba(255,255,255,0.18);
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── Card footer ── */
        .card-footer {
            text-align: center;
            font-size: 10px;
            letter-spacing: 0.04em;
            color: #333345;
            padding: 16px 36px;
            border-top: 1px solid var(--border);
        }

        /* Responsive Design for All Devices */
        @media (max-width: 480px) {
            .page { padding: 80px 16px 30px; }
            .card { width: 100%; max-width: calc(100vw - 32px); }
            .card-body { padding: 24px 20px 20px; }
            .card-header h1 { font-size: 1.5rem; }
            .eyebrow { font-size: 9px; }
            label { font-size: 10px; }
            input { padding: 11px 12px 11px 38px; font-size: 13px; }
            .btn-primary, .btn-ghost { font-size: 12px; padding: 11px 16px; }
            .divider { margin: 16px 0; }
            nav { padding: 1rem 3%; }
            .logo { font-size: 1.2rem; letter-spacing: 2px; }
            .nav-tag { font-size: 8px; }
        }

        @media (max-width: 768px) {
            .page { padding: 90px 20px 35px; }
            .card { width: min(90vw, 420px); }
            .card-body { padding: 32px 28px 28px; }
            .card-header h1 { font-size: 1.8rem; }
            nav { padding: 1.2rem 4%; }
            .logo { font-size: 1.3rem; }
        }

        @media (max-width: 1024px) {
            .page { padding: 95px 24px 40px; }
            .card { width: min(95vw, 420px); }
            nav { padding: 1.3rem 4.5%; }
        }

        @media (min-width: 1025px) {
            .page { padding: 100px 24px 40px; }
            .card { width: min(420px, calc(100vw - 40px)); }
            nav { padding: 1.4rem 5%; }
        }
    </style>
</head>
<body>
    <canvas id="neural-canvas"></canvas>
    <div class="bg-glow"></div>

    <nav>
        <div class="logo">INNER<span>TURE</span></div>
        <span class="nav-tag">Secure Portal</span>
    </nav>

    <div class="page">
        <div class="card">
            <div class="card-accent"></div>
            <div class="card-body">

                <div class="card-header">
                    <div class="eyebrow">Authentication</div>
                    <h1>Welcome back</h1>
                    <p>Sign in to continue to your account</p>
                </div>

                <div id="login-error"></div>

                <form id="loginForm" autocomplete="off">
                    <div class="field">
                        <label for="email">Email address</label>
                        <div class="input-wrap">
                            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">
                                <rect x="2" y="4" width="20" height="16" rx="3"/>
                                <path d="M2 7l10 7 10-7"/>
                            </svg>
                        </div>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">
                                <rect x="3" y="11" width="18" height="11" rx="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </div>
                    </div>

                    <a href="#" class="forgot">Forgot password?</a>

                    <button type="submit" class="btn-primary">Sign In</button>
                </form>

                <div class="divider"><span>or</span></div>

                <a href="/signup/register" id="goToRegister" class="btn-ghost">Create an account</a>
            </div>

            <div class="card-footer">Protected by end-to-end encryption</div>
        </div>
    </div>

    <script>
    // ── Background canvas ──
    (function() {
        const canvas = document.getElementById('neural-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let W = canvas.width  = window.innerWidth;
        let H = canvas.height = window.innerHeight;

        const particles = Array.from({ length: 80 }, () => {
            const x = Math.random() * W;
            const y = Math.random() * H;
            return { x, y, baseX: x, baseY: y, size: Math.random() * 1.4 + 0.6, density: Math.random() * 22 + 2 };
        });

        const mouse = { x: null, y: null, radius: 160 };
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('resize', () => {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
        });

        (function tick() {
            ctx.clearRect(0, 0, W, H);
            particles.forEach((p, i) => {
                if (mouse.x !== null) {
                    const dx = mouse.x - p.x, dy = mouse.y - p.y;
                    const d = Math.hypot(dx, dy);
                    if (d < mouse.radius) {
                        const f = (mouse.radius - d) / mouse.radius;
                        p.x -= (dx / d) * f * p.density;
                        p.y -= (dy / d) * f * p.density;
                    }
                }
                p.x += (p.baseX - p.x) / 14;
                p.y += (p.baseY - p.y) / 14;
                ctx.fillStyle = 'rgba(255,255,255,0.35)';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                for (let j = i + 1; j < particles.length; j++) {
                    const q = particles[j];
                    const d2 = Math.hypot(p.x - q.x, p.y - q.y);
                    if (d2 < 115) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255,255,255,${(1 - d2 / 115) * 0.18})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(q.x, q.y);
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(tick);
        })();
    })();

    // ── Login form ──
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email    = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;
        const btn      = e.target.querySelector('button[type="submit"]');
        const errorDiv = document.getElementById('login-error');
        const orig     = btn.textContent;

        errorDiv.style.display = 'none';
        btn.textContent = 'Authenticating…';
        btn.disabled = true;

        try {
            const res  = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (!res.ok) {
                errorDiv.textContent = data.error || 'Invalid email or password';
                errorDiv.style.display = 'block';
                return;
            }
            localStorage.setItem('loggedInUser', JSON.stringify(data.user));
            window.location.href = '../index.html';
        } catch (err) {
            errorDiv.textContent = 'Could not connect. ' + err.message;
            errorDiv.style.display = 'block';
        } finally {
            btn.textContent = orig;
            btn.disabled = false;
        }
    });
    </script>
</body>
</html>
