<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        if (!localStorage.getItem('loggedInUser')) {
            window.location.href = '/login/';
        }
    </script>
    
    <link rel="stylesheet" href="style.css">
    <title>Innerture | Cyber Simulation</title>
    <script src="https://unpkg.com/animejs@3.2.1/lib/anime.min.js"></script> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Angkor&family=Asimovian&family=Bitcount+Grid+Double:wght@100..900&family=Bungee+Tint&family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Chango&family=Silkscreen:wght@400;700&family=Tektur:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scroll-progress"></div>

   <canvas id="neural-canvas"></canvas>

   <nav class="top-nav">
        <div class="logo">INNER<span>TURE</span></div>
        <ul class="nav-links">
            <li><a href="/#discovery">The Engine</a></li>
            <li><a href="/public/simulation/sim.html">Simulations</a></li>
            <li><a href="/public/reality/reality.html">Reality Feed</a></li>
            <li><a href="/roadmap/index.html">Roadmap</a></li>
        </ul>
    </nav>

    <div class="shell">
        <div class="work-tablet">
        <nav class="tab-nav">
            <button class="tab-btn active" onclick="switchTab(event, 'overview')">Overview</button>
            <button class="tab-btn" onclick="switchTab(event, 'task')">Task Details</button>
            <button class="tab-btn" onclick="switchTab(event, 'workspace')">Workspace</button>
            <div class="tab-slider"></div>
        </nav>
        
        <div class="tab-content">
            <section id="overview" class="tab-section active">
                <h2 id="job-title-display">Mission Brief</h2>
                <div id="brief-content"></div>
            </section>
            
            <section id="task" class="tab-section">
                <h3 id="protocol-title">Strategic Response Protocol</h3>
                <div id="task-content"></div>
                <h3>Success Criteria</h3>
                <ul id="criteria-list" style="color: var(--muted); margin-left: 20px; line-height: 2; font-family: var(--font-mono); font-size: 0.9rem;"></ul>
            </section>
            
            <section id="workspace" class="tab-section">
                <h3>Analysis Workspace</h3>
                <textarea id="proposal" rows="10" placeholder="Type your strategic response here..."></textarea>
                <button class="neon-btn" onclick="submitProposal()">Transmit to Manager</button>
            </section>
        </div>
    </div>
</div>
    
    <div id="toast" class="toast">TRANSMISSION SUCCESSFUL // DATA UPLOADED</div>

    <script src = 'script.js'></script>
</body>
</html>
