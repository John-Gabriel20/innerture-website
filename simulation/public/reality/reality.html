<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innerture | Reality Feed</title>
    <script src="https://unpkg.com/animejs@3.2.1/lib/anime.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Angkor&family=Asimovian&family=Bitcount+Grid+Double:wght@100..900&family=Bungee+Tint&family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Chango&family=Silkscreen:wght@400;700&family=Tektur:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>
 
<canvas id="neural-canvas"></canvas>
 
<nav class="top-nav">
    <div class="logo">INNER<span>TURE</span></div>
    <ul class="nav-links">
        <li><a href="#">Discovery Engine</a></li>
        <li><a href="#">Simulations</a></li>
        <li><a href="#">Reality Feed</a></li>
    </ul>
</nav>
 
<div class="shell">
    <div class="work-tablet">
 
        <nav class="tab-nav">
            <button class="tab-btn active" onclick="switchTab(event,'feed')">Reality Feed</button>
            <button class="tab-btn"        onclick="switchTab(event,'analytics')">Analytics</button>
            <div class="path-badge" id="path-badge">—</div>
            <div class="tab-slider"></div>
        </nav>
 
        <div class="tab-content">
 
            <!-- FEED TAB -->
            <section id="feed" class="tab-section active">
                <div class="feed-header">
                    <h2 id="feed-title">Reality Feed</h2>
                    <p>Real workers. Real experiences. No filter.</p>
                </div>
                <div class="feed-body">
                    <div class="feed-scroll" id="feed-scroll"></div>
                    <aside class="analytics-sidebar" id="sidebar-stats"></aside>
                </div>
            </section>
 
            <!-- ANALYTICS TAB -->
            <section id="analytics" class="tab-section">
                <div class="analytics-body">
                    <div class="kpi-grid" id="kpi-grid"></div>
                    <div class="role-section-title">Role Breakdown</div>
                    <table class="role-table">
                        <thead>
                            <tr>
                                <th>Role</th>
                                <th>Hiring Level</th>
                                <th>Workplace</th>
                                <th>Days Off</th>
                                <th>Salary</th>
                            </tr>
                        </thead>
                        <tbody id="role-tbody"></tbody>
                    </table>
                </div>
            </section>
 
        </div>
    </div>
</div>
 
<div id="toast" class="toast">Feed synced to your path.</div>
 

<script src = 'reality.js'></script>
</body>
</html>
