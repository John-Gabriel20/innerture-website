<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asimovian&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="admin-page">
    <canvas id="neural-canvas"></canvas>
    <div class="scroll-progress"></div>
    <nav class="top-nav">
        <div class="logo">INNER<span>TURE</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Users</a></li>
            <li><a href="add-user.html">Add User</a></li>
        </ul>
    </nav>
    <main class="shell">
        <div class="work-tablet admin-shell">
            <header class="page-header">
                <div>
                    <span class="eyebrow">User Control</span>
                    <h1>Edit User</h1>
                    <p>Update user details with a more immersive and consistent admin experience.</p>
                </div>
                <a class="back-link" href="index.html">← Back to Users</a>
            </header>
            <section class="admin-card form-card glass-card">
                <form id="editUserForm">
                    <input type="hidden" id="userId">
                    <input type="text" id="name" placeholder="Name" required>
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="password" id="password" placeholder="Password">
                    <button type="submit" class="primary-btn">Update User</button>
                </form>
            </section>
        </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="../../script.js"></script>
    <script src="script.js"></script>
</body>
</html>
